<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Easy Talkers ✨</title>
<style>
*{box-sizing:border-box;font-family:Arial}body{margin:0;background:#fff}
.top{background:#00a884;color:#fff;padding:14px;font-weight:800;font-size:18px;display:flex;justify-content:space-between}
.field{padding:12px;margin:6px 0;border-radius:12px;border:1px solid #ddd;width:100%;font-size:15px}
.btn{padding:12px;margin:6px 0;border-radius:12px;border:none;width:100%;font-weight:700;cursor:pointer;font-size:15px}
.btn-dark{background:#111b21;color:#fff}.btn-green{background:#00a884;color:#fff}
.box{padding:18px;text-align:center}.user{padding:12px;border-bottom:1px solid #eee;display:flex;gap:10px;align-items:center;cursor:pointer;text-align:left}
.avatar{width:44px;height:44px;border-radius:50%;background:#00a884;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800}
.tab{display:flex;border-bottom:1px solid #eee}.tab button{flex:1;padding:12px;border:none;background:#fff;font-weight:700;cursor:pointer}
.tab button.active{color:#00a884;border-bottom:3px solid #00a884}
</style>
</head><body>
<div class="top"><span>💬 Easy Talkers</span><button id="logoutBtn" onclick="doLogout()" style="display:none;background:#ff3b30;color:#fff;border:none;padding:7px 12px;border-radius:20px;font-weight:700">Logout</button></div>

<!-- LOGIN -->
<div id="loginPage" class="box">
<h2>Welcome Back</h2>
<p style="color:#888;font-size:13px">Auto-login is ON</p>
<input class="field" id="loginEmail" placeholder="✉️ Email">
<input class="field" id="loginPass" type="password" placeholder="🔒 Password">
<button class="btn btn-dark" onclick="doLogin()">Login →</button>
<p id="loginMsg" style="color:red;font-size:13px;font-weight:700"></p>
<p>Don't have account?</p>
<button onclick="showSignup()" style="background:none;border:none;color:#00a884;font-weight:700;cursor:pointer">Create Account →</button>
</div>

<!-- SIGNUP -->
<div id="signupPage" class="box" style="display:none">
<h2>Create Account</h2>
<input class="field" id="name" placeholder="👤 Your Name">
<input class="field" id="email" placeholder="✉️ Email">
<input class="field" id="pass" type="password" placeholder="🔒 Password (6+ chars)">
<button class="btn btn-green" onclick="doRegister()">Create Account →</button>
<p id="authMsg" style="color:red;font-size:13px;font-weight:700"></p>
<button onclick="showLogin()" style="background:none;border:none;color:#00a884;font-weight:700;cursor:pointer">← Back to Login</button>
</div>

<!-- CHAT CENTER -->
<div id="appPage" style="display:none">
<div class="box" style="padding:10px;text-align:left">
<b id="meName">Me</b><br><small id="meEmail" style="color:#888"></small><br>
<small style="color:#00a884">🟢 You are in Chat Center — Auto-login works ✅</small>
</div>
<div class="tab">
<button id="tChats" class="active" onclick="showTab('chats')">Chats</button>
<button id="tContacts" onclick="showTab('contacts')">Contacts</button>
<button id="tGroups" onclick="showTab('groups')">Groups</button>
</div>
<div id="tabChats"></div>
<div id="tabContacts" style="display:none"></div>
<div id="tabGroups" style="display:none;padding:10px">
<input class="field" id="groupName" placeholder="Group name">
<button class="btn btn-green" onclick="createGroup()">+ Create Group</button>
<div id="groupsList"></div>
</div>
<div style="padding:10px"><input class="field" id="chatInput" placeholder="Type test message..."><button class="btn btn-green" onclick="sendTest()">Send Test Message</button><div id="testMsgs" style="text-align:left"></div></div>
</div>

<script>
function getUsers(){ try{ return JSON.parse(localStorage.getItem('et_users')||'[]'); }catch(e){ return []; } }
function saveUsers(u){ localStorage.setItem('et_users', JSON.stringify(u)); }
function showLogin(){ document.getElementById('loginPage').style.display='block'; document.getElementById('signupPage').style.display='none'; document.getElementById('appPage').style.display='none'; document.getElementById('logoutBtn').style.display='none'; }
function showSignup(){ document.getElementById('loginPage').style.display='none'; document.getElementById('signupPage').style.display='block'; document.getElementById('appPage').style.display='none'; }
function openApp(user){
  document.getElementById('loginPage').style.display='none';
  document.getElementById('signupPage').style.display='none';
  document.getElementById('appPage').style.display='block';
  document.getElementById('logoutBtn').style.display='block';
  document.getElementById('meName').innerText = '👋 ' + user.name;
  document.getElementById('meEmail').innerText = user.email;
  renderAll();
}
function doRegister(){
  var name = document.getElementById('name').value.trim();
  var email = document.getElementById('email').value.trim().toLowerCase();
  var pass = document.getElementById('pass').value;
  if(!name) return document.getElementById('authMsg').innerText = 'Enter Name';
  if(!email || email.indexOf('@')<0) return document.getElementById('authMsg').innerText = 'Enter valid Email';
  if(!pass || pass.length<6) return document.getElementById('authMsg').innerText = 'Password 6+ chars';
  var users = getUsers();
  if(users.find(function(u){ return u.email===email; })) return document.getElementById('authMsg').innerText = 'Email exists. Go to Login.';
  var nu = {name:name, email:email, pass:pass, uid:'u'+Date.now()};
  users.push(nu); saveUsers(users);
  localStorage.setItem('et_current', JSON.stringify(nu));
  document.getElementById('authMsg').innerText = '✅ Created!';
  openApp(nu);
}
function doLogin(){
  var email = document.getElementById('loginEmail').value.trim().toLowerCase();
  var pass = document.getElementById('loginPass').value;
  if(!email) return document.getElementById('loginMsg').innerText = 'Enter Email';
  if(!pass) return document.getElementById('loginMsg').innerText = 'Enter Password';
  document.getElementById('loginMsg').innerText = 'Logging in...';
  var users = getUsers();
  var found = users.find(function(u){ return u.email===email; });
  if(!found) return document.getElementById('loginMsg').innerText = 'No account. Tap Create Account.';
  if(found.pass !== pass) return document.getElementById('loginMsg').innerText = 'Wrong password. Try again.';
  document.getElementById('loginMsg').innerText = '✅ Login successful!';
  localStorage.setItem('et_current', JSON.stringify(found));
  openApp(found);
}
function doLogout(){
  if(!confirm('Logout?')) return;
  localStorage.removeItem('et_current');
  location.reload();
}
function showTab(t){
  document.getElementById('tabChats').style.display = t==='chats'?'block':'none';
  document.getElementById('tabContacts').style.display = t==='contacts'?'block':'none';
  document.getElementById('tabGroups').style.display = t==='groups'?'block':'none';
  document.getElementById('tChats').className = t==='chats'?'active':'';
  document.getElementById('tContacts').className = t==='contacts'?'active':'';
  document.getElementById('tGroups').className = t==='groups'?'active':'';
}
function renderAll(){
  var users = getUsers();
  var me = JSON.parse(localStorage.getItem('et_current')||'{}');
  var html = '';
  users.forEach(function(u){ if(u.email!==me.email) html += '<div class="user"><div class="avatar">'+u.name[0].toUpperCase()+'</div><div><b>'+u.name+'</b><br><small>'+u.email+'</small></div></div>'; });
  document.getElementById('tabChats').innerHTML = html || '<p style="padding:20px;text-align:center;color:#888">No chats yet — create another account to see it here</p>';
  document.getElementById('tabContacts').innerHTML = html || '<p style="padding:20px;text-align:center">No contacts yet</p>';
  var groups = JSON.parse(localStorage.getItem('et_groups')||'[]');
  var ghtml = '';
  groups.forEach(function(g){ ghtml += '<div class="user"><div class="avatar">👥</div><div><b>'+g.name+'</b><br><small>👑 Admin: '+g.adminName+'</small></div></div>'; });
  document.getElementById('groupsList').innerHTML = ghtml || '<p style="color:#888">No groups yet</p>';
}
function createGroup(){
  var n = document.getElementById('groupName').value.trim();
  if(!n) return alert('Enter group name');
  var me = JSON.parse(localStorage.getItem('et_current')||'{}');
  var groups = JSON.parse(localStorage.getItem('et_groups')||'[]');
  groups.push({name:n, adminName:me.name, admin:me.uid});
  localStorage.setItem('et_groups', JSON.stringify(groups));
  document.getElementById('groupName').value='';
  renderAll(); alert('✅ Group created — You are Admin');
}
function sendTest(){
  var t = document.getElementById('chatInput').value.trim();
  if(!t) return;
  document.getElementById('testMsgs').innerHTML += '<div style="background:#d9fdd3;padding:8px;border-radius:10px;margin:6px 0">'+t+'</div>';
  document.getElementById('chatInput').value='';
}
// AUTO-LOGIN ON LOAD
window.addEventListener('load', function(){
  try{
    var saved = localStorage.getItem('et_current');
    if(saved){
      var u = JSON.parse(saved);
      if(u && u.email){ openApp(u); return; }
    }
  }catch(e){}
  showLogin();
});
</script>
</body></html>
